<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案二：复古像素与冒险工会手账 · Pixel RPG Quest Scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dungeon-bg: #130e1c;
      --scroll-bg: #faecc8;
      --scroll-border: #6d411b;
      --scroll-shadow: #3b200b;
      --wood-dark: #2c1a0e;
      --gold-coin: #eab308;
      --seal-red: #b91c1c;
      --ink-color: #26170d;
      --ink-muted: #66503c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--dungeon-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink-color);
      position: relative;
      overflow-x: hidden;
      /* 复古地牢砖墙像素纹理 */
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(234, 179, 8, 0.12) 0%, transparent 60%),
        linear-gradient(rgba(19, 14, 28, 0.94), rgba(19, 14, 28, 0.94)),
        repeating-linear-gradient(0deg, #181124, #181124 16px, #120c1c 16px, #120c1c 32px);
    }

    /* 火把火光微晃动效 */
    .torch-light-left {
      position: fixed;
      top: 15%;
      left: 8%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 70%);
      filter: blur(40px);
      animation: torchFlicker 3s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .torch-light-right {
      position: fixed;
      top: 20%;
      right: 8%;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, transparent 70%);
      filter: blur(45px);
      animation: torchFlicker 2.6s infinite alternate-reverse ease-in-out;
      pointer-events: none;
    }

    @keyframes torchFlicker {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15) translate(4px, -3px); }
      100% { opacity: 0.8; transform: scale(0.95) translate(-2px, 2px); }
    }

    /* 冒险工会通行卷轴 */
    .rpg-scroll {
      position: relative;
      z-index: 10;
      width: 780px;
      max-width: 100%;
      background: var(--scroll-bg);
      border: 6px solid var(--scroll-border);
      border-radius: 12px;
      box-shadow: 
        0 0 0 4px var(--wood-dark),
        0 24px 50px rgba(0, 0, 0, 0.8),
        inset 0 0 60px rgba(162, 107, 43, 0.35);
      padding: 40px 50px;
      animation: scrollDrop 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes scrollDrop {
      0% { transform: translateY(-40px) scale(0.94); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* 卷轴复古皮角修饰 */
    .rpg-scroll::before {
      content: '◆';
      position: absolute;
      top: 8px;
      left: 12px;
      color: #92531d;
      font-size: 16px;
    }
    .rpg-scroll::after {
      content: '◆';
      position: absolute;
      top: 8px;
      right: 12px;
      color: #92531d;
      font-size: 16px;
    }

    /* 顶部公会印章与徽章 */
    .guild-header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      padding-bottom: 18px;
      border-bottom: 3px dashed rgba(109, 65, 27, 0.3);
    }

    .pixel-badge {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: #78350f;
      background: #fde68a;
      padding: 4px 10px;
      border: 2px solid #b45309;
      box-shadow: 2px 2px 0 #78350f;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .guild-title {
      font-family: 'MedievalSharp', 'Noto Sans SC', cursive;
      font-size: 32px;
      font-weight: 800;
      color: #3b1d06;
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);
    }

    .guild-subtitle {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 5px;
      font-style: italic;
    }

    /* 火漆印章 */
    .wax-seal {
      position: absolute;
      top: -24px;
      right: -18px;
      width: 68px;
      height: 68px;
      background: radial-gradient(circle, #dc2626 40%, #991b1b 100%);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fecaca;
      font-weight: bold;
      font-size: 11px;
      transform: rotate(12deg);
      border: 3px solid #7f1d1d;
      text-align: center;
      line-height: 1.1;
      user-select: none;
    }

    /* 像素模式切换按键 */
    .mode-switch-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .pixel-tab-btn {
      background: #e6d3a3;
      border: 3px solid #6d411b;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #45240c;
      box-shadow: 3px 3px 0 #3b200b;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
    }

    .pixel-tab-btn:hover {
      background: #f1e2be;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #3b200b;
    }

    .pixel-tab-btn.active {
      background: #f59e0b;
      color: #fff;
      border-color: #78350f;
      box-shadow: inset 2px 2px 0 #b45309, 2px 2px 0 #3b200b;
      transform: translate(2px, 2px);
    }

    /* 表单区域 */
    .scroll-form {
      max-width: 480px;
      margin: 0 auto;
    }

    .field-block {
      margin-bottom: 18px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: #4a2810;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field-input-box {
      position: relative;
      background: #fdfaf2;
      border: 3px solid #855325;
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .field-input-box input {
      width: 100%;
      height: 44px;
      border: none;
      background: transparent;
      padding: 0 14px;
      font-size: 15px;
      color: #2b1708;
      font-weight: 600;
      outline: none;
    }

    .field-input-box input::placeholder {
      color: #ab967d;
      font-weight: 400;
    }

    .field-input-box:focus-within {
      border-color: #d97706;
      box-shadow: 0 0 0 2px #fde68a, inset 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    /* 像素按钮：3D 按压体验 */
    .pixel-main-btn {
      width: 100%;
      height: 52px;
      margin-top: 10px;
      background: #16a34a;
      border: 4px solid #14532d;
      border-radius: 6px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 6px 0 #14532d, 0 10px 14px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.08s;
      user-select: none;
    }

    .pixel-main-btn:hover {
      background: #22c55e;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #14532d, 0 12px 18px rgba(0,0,0,0.35);
    }

    .pixel-main-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #14532d, 0 4px 6px rgba(0,0,0,0.2);
    }

    /* 辅助链接 */
    .scroll-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #785233;
    }

    .guild-rules-link {
      color: #92400e;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .guild-perks {
      display: flex;
      justify-content: space-around;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 2px dashed rgba(109, 65, 27, 0.25);
      font-size: 12px;
      color: #613916;
      font-weight: 600;
    }

    .perk-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    @media (max-width: 600px) {
      .rpg-scroll { padding: 30px 20px; }
      .wax-seal { display: none; }
    }
  </style>
</head>
<body>

  <!-- 火光背景光效 -->
  <div class="torch-light-left"></div>
  <div class="torch-light-right"></div>

  <!-- 卷轴卡片 -->
  <div class="rpg-scroll">

    <!-- 火漆印章 -->
    <div class="wax-seal">
      GUILD<br>SEAL
    </div>

    <!-- 顶部工会徽章 -->
    <div class="guild-header">
      <div class="pixel-badge">⚔️ ADVENTURER'S PASSPORT ⚔️</div>
      <h1 class="guild-title" id="guildTitle">灵语冒险者工会 · 通行检录</h1>
      <p class="guild-subtitle" id="guildSub">“呈递你的冒险誓约，前往阳光大厅与神秘遗迹”</p>
    </div>

    <!-- 模式切换 -->
    <div class="mode-switch-bar">
      <button class="pixel-tab-btn active" id="tabLogin" onclick="switchRpgMode('login')">📜 验照入馆 (登录)</button>
      <button class="pixel-tab-btn" id="tabRegister" onclick="switchRpgMode('register')">✍️ 签署契约 (注册)</button>
    </div>

    <!-- 表单区 -->
    <form class="scroll-form" onsubmit="event.preventDefault(); submitRpg();">
      
      <!-- 代号 -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">🛡️ 冒险者名号 (Username)</span>
          <span style="font-size: 11px; color: #855325;">* 必填公会代号</span>
        </div>
        <div class="field-input-box">
          <input type="text" id="rpgUser" placeholder="例如：leo_ranger" required value="admin">
        </div>
      </div>

      <!-- 称号/昵称（注册显示） -->
      <div class="field-block" id="rpgNickBlock" style="display: none;">
        <div class="field-header">
          <span class="field-label">✨ 公会公开称号 (Nickname)</span>
          <span style="font-size: 11px; color: #855325;">展示在头顶的头衔</span>
        </div>
        <div class="field-input-box">
          <input type="text" id="rpgNick" placeholder="例如：晨曦逐星者">
        </div>
      </div>

      <!-- 密语 -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">🗝️ 通行通关密语 (Password)</span>
          <span style="font-size: 11px; color: #855325;">6位以上符文密码</span>
        </div>
        <div class="field-input-box">
          <input type="password" id="rpgPwd" placeholder="输入你的通关密语" required value="123456">
        </div>
      </div>

      <!-- 确认密语（注册显示） -->
      <div class="field-block" id="rpgConfirmBlock" style="display: none;">
        <div class="field-header">
          <span class="field-label">📜 重复确认密语 (Confirm)</span>
        </div>
        <div class="field-input-box">
          <input type="password" id="rpgConfirm" placeholder="再次确认契约密语">
        </div>
      </div>

      <!-- 提交按键 -->
      <button type="submit" class="pixel-main-btn" id="rpgSubmitBtn">
        <span>⚔️ 确认入馆，启程！</span>
      </button>

      <!-- 底部附加提示 -->
      <div class="scroll-footer">
        遇到通行困难？<span class="guild-rules-link" onclick="alert('已向公会联络官 Evelyn 发送飞鸽传书！')">联络公会执事官</span>
      </div>

      <!-- 工会福利微标 -->
      <div class="guild-perks">
        <span class="perk-item">🪙 每日签到星语币</span>
        <span class="perk-item">📖 专属学者词典手账</span>
        <span class="perk-item">🏆 全服成就雕像</span>
      </div>
    </form>

  </div>

  <script>
    let mode = 'login';

    function switchRpgMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const title = document.getElementById('guildTitle');
      const sub = document.getElementById('guildSub');
      const nickBlock = document.getElementById('rpgNickBlock');
      const confirmBlock = document.getElementById('rpgConfirmBlock');
      const btn = document.getElementById('rpgSubmitBtn');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        title.innerText = '灵语冒险者工会 · 通行检录';
        sub.innerText = '“呈递你的冒险誓约，前往阳光大厅与神秘遗迹”';
        nickBlock.style.display = 'none';
        confirmBlock.style.display = 'none';
        btn.querySelector('span').innerText = '⚔️ 确认入馆，启程！';
        btn.style.background = '#16a34a';
        btn.style.borderColor = '#14532d';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        title.innerText = '缔结冒险誓约 · 成为新领航员';
        sub.innerText = '“签署羊皮纸契约，公会将为你颁发 20 金币初始物资”';
        nickBlock.style.display = 'block';
        confirmBlock.style.display = 'block';
        btn.querySelector('span').innerText = '📜 签署契约，领取初始物资！';
        btn.style.background = '#ea580c';
        btn.style.borderColor = '#9a3412';
      }
    }

    function submitRpg() {
      const btn = document.getElementById('rpgSubmitBtn');
      const text = btn.querySelector('span').innerText;
      btn.querySelector('span').innerText = '⌛ 正在盖章通行印记...';
      setTimeout(() => {
        alert(mode === 'login' ? '🏰 欢迎回归公会！大门已为你开启！' : '🌟 恭喜成为认证冒险者！已获得 20 星语金币！');
        btn.querySelector('span').innerText = text;
      }, 600);
    }
  </script>
</body>
</html>
